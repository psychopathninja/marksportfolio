<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mark Vincent Faith Item Portfolio">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mark Vincent Faith Item">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mark Vincent Faith Item</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    /* This targets the old Flutter website */
    body.crumple flt-glass-pane,
    body.crumple flutter-view {
      animation: crumpleOldSite 2.4s ease-in-out forwards;
      transform-origin: center;
    }

    .redirect-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.25), rgba(2, 6, 23, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      animation: overlayIn 2.4s ease-in-out forwards;
      font-family: Arial, Helvetica, sans-serif;
    }

    .message-box {
      background: rgba(255, 255, 255, 0.92);
      color: #111827;
      padding: 34px 42px;
      border-radius: 24px;
      text-align: center;
      max-width: 520px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      animation: messageFloat 2.4s ease-in-out forwards;
    }

    .message-box h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: -1px;
    }

    .message-box p {
      margin: 8px 0;
      font-size: 16px;
      line-height: 1.5;
    }

    .message-box .small {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.65;
    }

    @keyframes crumpleOldSite {
      0% {
        transform: scale(1) rotate(0deg);
        filter: blur(0);
        opacity: 1;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      30% {
        transform: scale(1.03) rotate(-1deg);
        filter: blur(0);
      }

      55% {
        transform: scale(0.78) rotate(5deg) skew(-10deg, 5deg);
        filter: blur(1px);
        clip-path: polygon(8% 5%, 93% 0, 98% 86%, 10% 97%);
      }

      80% {
        transform: scale(0.28) rotate(22deg) skew(18deg, -12deg);
        opacity: 0.65;
        filter: blur(3px);
        clip-path: polygon(30% 8%, 80% 18%, 68% 75%, 24% 82%);
      }

      100% {
        transform: scale(0.02) rotate(60deg) skew(35deg, -25deg);
        opacity: 0;
        filter: blur(8px);
        clip-path: polygon(45% 42%, 55% 43%, 54% 54%, 44% 52%);
      }
    }

    @keyframes overlayIn {
      0% {
        opacity: 0;
      }

      35% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes messageFloat {
      0% {
        transform: translateY(20px) scale(0.95);
        opacity: 0;
      }

      55% {
        transform: translateY(20px) scale(0.95);
        opacity: 0;
      }

      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
  </style>

  <script>
    const serviceWorkerVersion = "3687009479";
  </script>

  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();

            // Show old portfolio first for 5 seconds
            setTimeout(function() {
              document.body.classList.add("crumple");

              const overlay = document.createElement("div");
              overlay.className = "redirect-overlay";
              overlay.innerHTML = `
                <div class="message-box">
                  <h1>Old Portfolio Archived</h1>
                  <p>This portfolio has been placed back in the baul.</p>
                  <p>Redirecting to Mark’s new portfolio...</p>
                  <p class="small">Goodbye, Flutter era. Goodbye, Muhammad Hamza.</p>
                </div>
              `;
              document.body.appendChild(overlay);
            }, 5000);

            // Redirect after dramatic effect
            setTimeout(function() {
              window.location.href = "https://marksportfolio-phi.vercel.app/";
            }, 8500);
          });
        }
      });
    });
  </script>
</body>
</html>
